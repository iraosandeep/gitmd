name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers when you push or merge changes into your main branch

permissions:
  contents: write  # Gives the action permission to write to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Deploy static build to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Use 'dist' if you use Vite. Change to 'build' if you use Create React App.
          branch: gh-pages
